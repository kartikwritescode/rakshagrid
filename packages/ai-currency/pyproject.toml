[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rakshagrid-ai-currency"
version = "2.0.0"
description = "Raksha Grid AI Counterfeit Currency Detector"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "Raksha Grid Team"}
]
dependencies = [
    "rakshagrid-common",
    "numpy>=1.26.0",
    "pillow>=10.0.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["rakshagrid.ai_currency*", "rakshagrid.currency*", "src*"]

