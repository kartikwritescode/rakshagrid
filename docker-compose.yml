services:
  backend:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: rakshagrid_backend
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - DEBUG=False
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - RAKSHAGRID_API_KEY=${RAKSHAGRID_API_KEY:-rakshagrid-master-key-2026}
    volumes:
      - ./storage:/workspace/storage
      - ./artifacts:/workspace/artifacts
      - ./data:/workspace/data:ro
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: rakshagrid_frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped
